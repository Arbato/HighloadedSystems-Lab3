server:
  port: ${SERVER_PORT:0}

spring:
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:kafka:9092,kafka-2:9093,kafka-3:9094}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      retries: 3
    consumer:
      bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:kafka:9092,kafka-2:9093,kafka-3:9094}
      group-id: notification-service
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      auto-offset-reset: earliest

  r2dbc:
    url: r2dbc:postgresql://${DB_HOST:postgres-notification}:${DB_PORT:5432}/${DB_NAME:itmomarket_notification}
    username: ${DB_USER:itmouser}
    password: ${DB_PASSWORD:itmopassword}
    pool:
      initial-size: 5
      max-size: 20
      max-idle-time: 300s
      validation-query: SELECT 1

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0
    url: jdbc:postgresql://${DB_HOST:postgres-notification}:${DB_PORT:5432}/${DB_NAME:itmomarket_notification}
    user: ${DB_USER:itmouser}
    password: ${DB_PASSWORD:itmopassword}
    schemas: public
    table: flyway_schema_history
    validate-on-migrate: true

logging:
  level:
    ru.itmo.notificationservice: DEBUG
    org.springframework.r2dbc: DEBUG
    org.springframework.kafka: INFO

springdoc:
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
  api-docs:
    path: /v1/api-docs

eureka:
  instance:
    hostname: notification-service
    instance-id: notification-service:${server.port}
    prefer-ip-address: false
    lease-renewal-interval-in-seconds: 5
    lease-expiration-duration-in-seconds: 15
  client:
    serviceUrl:
      defaultZone: http://${EUREKA_HOST:eureka}:${EUREKA_PORT:8761}/eureka
    register-with-eureka: true
    fetch-registry: true

management:
  health:
    livenessState:
      enabled: true
    readinessState:
      enabled: true
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health,info,metrics
