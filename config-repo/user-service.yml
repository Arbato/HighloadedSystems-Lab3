server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /

spring:
  kafka:
    bootstrap-servers: kafka:9092
    
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.info: false  # ← ОТКЛЮЧИТЬ metadata
      acks: all
      retries: 3
    
    consumer:
      bootstrap-servers: kafka:9092
      group-id: user-service-request-processor
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer  # ← JSON!
      properties:
        spring.json.trusted.packages: "*"
        spring.json.use.type.info.headers: false  # ← ОТКЛЮЧИТЬ metadata
      auto-offset-reset: earliest
      enable-auto-commit: false  # Manual ack
      max-poll-records: 100

  r2dbc:
    url: r2dbc:postgresql://${DB_HOST:postgres-user}:${DB_PORT:5432}/${DB_NAME:itmomarket_user}
    username: ${DB_USER:itmouser}
    password: ${DB_PASSWORD:itmopassword}
    pool:
      initial-size: 10
      max-size: 20
      max-idle-time: 30m
      validation-query: SELECT 1
  
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0
    url: jdbc:postgresql://${DB_HOST:postgres-user}:${DB_PORT:5432}/${DB_NAME:itmomarket_user}
    user: ${DB_USER:itmouser}
    password: ${DB_PASSWORD:itmopassword}
    schemas: public
    table: flyway_schema_history
    validate-on-migrate: true

logging:
  level:
    ru.itmo.userservice: DEBUG
    org.springframework.r2dbc: DEBUG
    org.flywaydb: DEBUG
    org.springframework.security: DEBUG

springdoc:
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
  api-docs:
    path: /v1/api-docs

app:
  jwt:
    secret: ${JWT_SECRET:your-secret-key-min-32-chars-long-here}
    expiration: 86400000

eureka:
  instance:
    hostname: user-service
    instance-id: user-service:${server.port}
    prefer-ip-address: false
    lease-renewal-interval-in-seconds: 5
    lease-expiration-duration-in-seconds: 15
  client:
    serviceUrl:
      defaultZone: http://${EUREKA_HOST:eureka}:${EUREKA_PORT:8761}/eureka
    register-with-eureka: true
    fetch-registry: true

management:
  health:
    livenessState:
      enabled: true          # Включает /actuator/health/liveness
    readinessState:
      enabled: true          # Включает /actuator/health/readiness
  endpoint:
    health:
      show-details: always   # Показывает детали компонентов (БД, кэши, etc)
      probes:
        enabled: true        # Для Kubernetes-like проб
  endpoints:
    web:
      exposure:
        include: health,info,metrics  # Что экспонировать
