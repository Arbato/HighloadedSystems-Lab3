server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /

spring:
  kafka:
    bootstrap-servers: kafka:9092,kafka-2:9093,kafka-3:9094
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      retries: 3
    consumer:
      bootstrap-servers: kafka:9092,kafka-2:9093,kafka-3:9094
      group-id: moderation-service
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "ru.itmo.market.model.events"
      auto-offset-reset: earliest
      enable-auto-commit: true          
      auto-commit-interval-ms: 5000     
      max-poll-records: 100
      session-timeout-ms: 30000

  r2dbc:
    url: r2dbc:postgresql://${DB_HOST:postgres-moderation}:${DB_PORT:5432}/${DB_NAME:itmomarket_moderation}
    username: ${DB_USER:itmouser}
    password: ${DB_PASSWORD:itmopassword}
    pool:
      initial-size: 5
      max-size: 20
      max-idle-time: 300s
      validation-query: SELECT 1
  
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0
    url: jdbc:postgresql://${DB_HOST:postgres-moderation}:${DB_PORT:5432}/${DB_NAME:itmomarket_moderation}
    user: ${DB_USER:itmouser}
    password: ${DB_PASSWORD:itmopassword}
    schemas: public
    table: flyway_schema_history
    validate-on-migrate: true

logging:
  level:
    ru.itmo.market: DEBUG
    org.springframework.r2dbc: DEBUG
    org.flywaydb: DEBUG
    org.springframework.security: DEBUG

app:
  moderation:
    batch-size: 10
    timeout: 30

springdoc:
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
  api-docs:
    path: /v1/api-docs

eureka:
  instance:
    hostname: moderation-service
    instance-id: moderation-service:${server.port}
    prefer-ip-address: false
    lease-renewal-interval-in-seconds: 5
    lease-expiration-duration-in-seconds: 15
  client:
    serviceUrl:
      defaultZone: http://${EUREKA_HOST:eureka}:${EUREKA_PORT:8761}/eureka
    register-with-eureka: true
    fetch-registry: true

# Resilience4j for Moderation Service
resilience4j:
  circuitbreaker:
    instances:
      product-service:
        registerHealthIndicator: true
        slidingWindowSize: 5
        minimumNumberOfCalls: 3
        failureRateThreshold: 50
      user-service:
        registerHealthIndicator: true
        slidingWindowSize: 5
        minimumNumberOfCalls: 3
        failureRateThreshold: 50
  timelimiter:
    instances:
      product-service:
        timeoutDuration: 10s
      user-service:
        timeoutDuration: 10s

management:
  health:
    livenessState:
      enabled: true          # Включает /actuator/health/liveness
    readinessState:
      enabled: true          # Включает /actuator/health/readiness
  endpoint:
    health:
      show-details: always   # Показывает детали компонентов (БД, кэши, etc)
      probes:
        enabled: true        # Для Kubernetes-like проб
  endpoints:
    web:
      exposure:
        include: health,info,metrics  # Что экспонировать

