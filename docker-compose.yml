version: '3.8'

services:
  # ========================
  # INFRASTRUCTURE SERVICES
  # ========================

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_SYNC_LIMIT: 2
      ZOOKEEPER_INIT_LIMIT: 5
    ports:
      - "2181:2181"
    networks:
      - itmo-network
    healthcheck:
      test: [ "CMD-SHELL", "echo ruok | nc localhost 2181" ]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    depends_on:
      zookeeper:
        condition: service_healthy
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT_INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_MIN_INSYNC_REPLICAS: 2
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_RETENTION_HOURS: 24
      KAFKA_LOG_RETENTION_BYTES: 1073741824
    ports:
      - "9092:9092"
      - "29092:29092"
    networks:
      - itmo-network
    healthcheck:
      test: [ "CMD", "nc", "-z", "localhost", "9092" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

  kafka-2:
    image: confluentinc/cp-kafka:7.5.0
    depends_on:
      zookeeper:
        condition: service_healthy
    environment:
      KAFKA_BROKER_ID: 2
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-2:9093,PLAINTEXT_INTERNAL://kafka-2:29093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT_INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_MIN_INSYNC_REPLICAS: 2
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_RETENTION_HOURS: 24
      KAFKA_LOG_RETENTION_BYTES: 1073741824
    ports:
      - "9093:9093"
      - "29093:29093"
    networks:
      - itmo-network
    healthcheck:
      test: [ "CMD", "nc", "-z", "localhost", "9093" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

  kafka-3:
    image: confluentinc/cp-kafka:7.5.0
    depends_on:
      zookeeper:
        condition: service_healthy
    environment:
      KAFKA_BROKER_ID: 3
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-3:9094,PLAINTEXT_INTERNAL://kafka-3:29094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT_INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_MIN_INSYNC_REPLICAS: 2
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_RETENTION_HOURS: 24
      KAFKA_LOG_RETENTION_BYTES: 1073741824
    ports:
      - "9094:9094"
      - "29094:29094"
    networks:
      - itmo-network
    healthcheck:
      test: [ "CMD", "nc", "-z", "localhost", "9094" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    depends_on:
      kafka:
        condition: service_healthy
      kafka-2:
        condition: service_healthy
      kafka-3:
        condition: service_healthy
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092,kafka-2:9093,kafka-3:9094
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181
    ports:
      - "2183:8080"
    networks:
      - itmo-network
  
  eureka-server:
    build:
      context: ./eureka-server
      dockerfile: Dockerfile
    container_name: eureka-server
    ports:
      - "8761:8761"  # Eureka всегда на 8761 (для регистрации)
    environment:
      - EUREKA_PORT=8761
    networks:
      - itmo-network
    depends_on:
      config-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8761/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  config-server:
    build:
      context: ./config-server
      dockerfile: Dockerfile
    container_name: config-server
    ports:
      - "8888:8888"  # Config Server всегда на 8888 (для подключения)
    environment:
      - CONFIG_PORT=8888
      - CONFIG_REPO_PATH=/config-repo
    volumes:
      - ./config-repo:/config-repo:ro
    networks:
      - itmo-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8888/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 500s

  # ========================
  # DATABASE SERVICES
  # ========================

  postgres-user:
    image: postgres:15-alpine
    container_name: postgres-user
    environment:
      POSTGRES_USER: itmouser
      POSTGRES_PASSWORD: itmopassword
      POSTGRES_DB: itmomarket_user
    volumes:
      - postgres_user_data:/var/lib/postgresql/data
    ports:
      - "5401:5432"
    networks:
      - itmo-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U itmouser -d itmomarket_user"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres-product:
    image: postgres:15-alpine
    container_name: postgres-product
    environment:
      POSTGRES_USER: itmouser
      POSTGRES_PASSWORD: itmopassword
      POSTGRES_DB: itmomarket_product
    volumes:
      - postgres_product_data:/var/lib/postgresql/data
    ports:
      - "5402:5432"
    networks:
      - itmo-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U itmouser -d itmomarket_product"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres-order:
    image: postgres:15-alpine
    container_name: postgres-order
    environment:
      POSTGRES_USER: itmouser
      POSTGRES_PASSWORD: itmopassword
      POSTGRES_DB: itmomarket_order
    volumes:
      - postgres_order_data:/var/lib/postgresql/data
    ports:
      - "5403:5432"
    networks:
      - itmo-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U itmouser -d itmomarket_order"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres-moderation:
    image: postgres:15-alpine
    container_name: postgres-moderation
    environment:
      POSTGRES_USER: itmouser
      POSTGRES_PASSWORD: itmopassword
      POSTGRES_DB: itmomarket_moderation
    volumes:
      - postgres_moderation_data:/var/lib/postgresql/data
    ports:
      - "5404:5432"
    networks:
      - itmo-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U itmouser -d itmomarket_moderation"]
      interval: 10s
      timeout: 5s
      retries: 5

  adminer:
    image: adminer:latest
    container_name: adminer
    ports:
      - "9999:8080" 
    depends_on:
      postgres-user:
        condition: service_healthy
      postgres-product:
        condition: service_healthy
      postgres-order:
        condition: service_healthy
      postgres-moderation:
        condition: service_healthy
    networks:
      - itmo-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s


  # ========================
  # MICROSERVICES (RANDOM PORTS)
  # ========================

  user-service:
    build:
      context: ./user-service
      dockerfile: Dockerfile
    container_name: user-service
    ports:
      - "0:8080"  # ← RANDOM port mapped to 8081 in container
    environment:
      - SERVER_PORT=8080  # ← Internal port (фиксированный в контейнере)
      - DB_HOST=postgres-user
      - DB_PORT=5432
      - DB_NAME=itmomarket_user
      - DB_USER=itmouser
      - DB_PASSWORD=itmopassword
      - CONFIG_SERVER_HOST=config-server
      - CONFIG_SERVER_PORT=8888
      - EUREKA_HOST=eureka-server
      - EUREKA_PORT=8761
      - SPRING_PROFILES_ACTIVE=docker
      - JWT_SECRET=your-super-secret-jwt-key-min-32-characters-long
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092,kafka-2:9093,kafka-3:9094
    depends_on:
      eureka-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
      gateway-service:
        condition: service_healthy
      postgres-user:
        condition: service_healthy
      kafka:
        condition: service_healthy
      kafka-2:
        condition: service_healthy
      kafka-3:
        condition: service_healthy
    networks:
      - itmo-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  product-service:
    build:
      context: ./product-service
      dockerfile: Dockerfile
    container_name: product-service
    ports:
      - "0:8080"  # ← RANDOM port
    environment:
      - SERVER_PORT=8080
      - DB_HOST=postgres-product
      - DB_PORT=5432
      - DB_NAME=itmomarket_product
      - DB_USER=itmouser
      - DB_PASSWORD=itmopassword
      - CONFIG_SERVER_HOST=config-server
      - CONFIG_SERVER_PORT=8888
      - EUREKA_HOST=eureka-server
      - EUREKA_PORT=8761
      - SPRING_PROFILES_ACTIVE=docker
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092,kafka-2:9093,kafka-3:9094
    depends_on:
      eureka-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
      gateway-service:
        condition: service_healthy
      postgres-product:
        condition: service_healthy
      user-service:
        condition: service_healthy
      kafka:
        condition: service_healthy
      kafka-2:
        condition: service_healthy
      kafka-3:
        condition: service_healthy
    networks:
      - itmo-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  order-service:
    build:
      context: ./order-service
      dockerfile: Dockerfile
    container_name: order-service
    ports:
      - "0:8080"  # ← RANDOM port
    environment:
      - SERVER_PORT=8080
      - DB_HOST=postgres-order
      - DB_PORT=5432
      - DB_NAME=itmomarket_order
      - DB_USER=itmouser
      - DB_PASSWORD=itmopassword
      - CONFIG_SERVER_HOST=config-server
      - CONFIG_SERVER_PORT=8888
      - EUREKA_HOST=eureka-server
      - EUREKA_PORT=8761
      - SPRING_PROFILES_ACTIVE=docker
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092,kafka-2:9093,kafka-3:9094
    depends_on:
      eureka-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
      gateway-service:
        condition: service_healthy
      postgres-order:
        condition: service_healthy
      product-service:
        condition: service_healthy
      user-service:
        condition: service_healthy
      kafka:
        condition: service_healthy
      kafka-2:
        condition: service_healthy
      kafka-3:
        condition: service_healthy
    networks:
      - itmo-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  moderation-service:
    build:
      context: ./moderation-service
      dockerfile: Dockerfile
    container_name: moderation-service
    ports:
      - "0:8080"  # ← RANDOM port
    environment:
      - SERVER_PORT=8080
      - DB_HOST=postgres-moderation
      - DB_PORT=5432
      - DB_NAME=itmomarket_moderation
      - DB_USER=itmouser
      - DB_PASSWORD=itmopassword
      - CONFIG_SERVER_HOST=config-server
      - CONFIG_SERVER_PORT=8888
      - EUREKA_HOST=eureka-server
      - EUREKA_PORT=8761
      - SPRING_PROFILES_ACTIVE=docker
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092,kafka-2:9093,kafka-3:9094
    depends_on:
      eureka-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
      postgres-moderation:
        condition: service_healthy
      product-service:
        condition: service_healthy
      user-service:
        condition: service_healthy
      gateway-service:
        condition: service_healthy
      kafka:
        condition: service_healthy
      kafka-2:
        condition: service_healthy
      kafka-3:
        condition: service_healthy
    networks:
      - itmo-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8084/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  gateway-service:
    build:
      context: ./gateway-service
      dockerfile: Dockerfile
    container_name: gateway-service
    ports:
      - "8080:8080"  # ← Gateway всегда на 8080 (entry point)
    environment:
      - SERVER_PORT=8080
      - CONFIG_SERVER_HOST=config-server
      - CONFIG_SERVER_PORT=8888
      - EUREKA_HOST=eureka-server
      - EUREKA_PORT=8761
      - SPRING_PROFILES_ACTIVE=docker
      - JWT_SECRET=your-super-secret-jwt-key-min-32-characters-long
    depends_on:
      eureka-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
    networks:
      - itmo-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

networks:
  itmo-network:
    driver: bridge

volumes:
  postgres_user_data:
  postgres_product_data:
  postgres_order_data:
  postgres_moderation_data:
